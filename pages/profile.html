<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | TaskFlow</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

    *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#202124;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
width:650px;
background:#2d2f34;
padding:40px;
border-radius:20px;
}

.avatar{
width:120px;
height:120px;
background:#3b82f6;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
font-weight:bold;
margin-bottom:25px;
}

h1{
text-align:center;
margin-bottom:30px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    color:white;
    font-weight:600;
}

input{
width:100%;
padding:15px;
margin-bottom:20px;
background:#3d4046;
border:none;
border-radius:10px;
color:white;
}

button{
width:100%;
padding:15px;
background:#3b82f6;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#2563eb;
}


/* Back Arrow */
.back-button {
    position: fixed;
    top: 35px;
    left: 35px;

    width: 44px;
    height: 44px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    background: #2d2f34;
    color: white;
    border: 1px solid #4b4e54;
    border-radius: 12px;
    text-decoration: none;

    transition: 0.2s ease;
    z-index: 10;
}

.back-button:hover {
    background: #3b82f6;
    border-color: #3b82f6;
    transform: translateX(-3px);
}

.back-button:focus-visible {
    outline: 2px solid #93c5fd;
    outline-offset: 3px;
}


</style>

</head>

<body>

    
<!-- Back to Dashboard -->
<a href="dashboard.html"
   class="back-button"
   title="Back to Dashboard"
   aria-label="Back to Dashboard">

    <svg xmlns="http://www.w3.org/2000/svg"
         width="22"
         height="22"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
        <path d="M19 12H5"/>
        <path d="m12 19-7-7 7-7"/>
    </svg>

</a>


<div class="container">

<div class="avatar">

?

</div>

<h1>My Profile</h1>

<label>Name:</label>
<input id="name" type="text" placeholder="Enter your full name">

<label>Email:</label>
<input type="email" placeholder="Enter your email">

<label>Course:</label>
<input type="text" placeholder="Enter your course">

<label>Section:</label>
<input type="text" placeholder="Enter your section">

<button type="button">

Save Changes

</button>

</div>

<script src="script.js"></script>

</body>
</html>
