<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Task | TaskFlow</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#202124;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
width:500px;
background:#2d2f34;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.warning{
font-size:70px;
margin-bottom:20px;
}

h1{
margin-bottom:20px;
}

p{
color:#c7c7c7;
margin-bottom:30px;
line-height:28px;
}

.buttons{
display:flex;
gap:20px;
justify-content:center;
}

.delete-btn{
background:#ef4444;
color:white;
padding:15px 35px;
border:none;
border-radius:10px;
cursor:pointer;
}

.cancel-btn{
background:#3b82f6;
color:white;
padding:15px 35px;
border:none;
border-radius:10px;
cursor:pointer;
}

button{
font-size:16px;
}

a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="warning">
⚠️
</div>

<h1>Delete Task</h1>

<p>

Are you sure you want to delete

<b>Programming Project</b>?

</p>

<div class="buttons">

<button class="delete-btn">

Delete

</button>

<a href="tasks.html">

<button class="cancel-btn">

Cancel

</button>

</a>

</div>

</div>

</body>
</html>
