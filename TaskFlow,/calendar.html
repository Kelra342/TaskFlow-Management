<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar | TaskFlow</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#202124;
color:white;
padding:40px;
}

.container{
max-width:1100px;
margin:auto;
}

h1{
margin-bottom:30px;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:15px;
}

.day{
background:#2d2f34;
padding:20px;
border-radius:15px;
min-height:120px;
}

.day h3{
margin-bottom:10px;
color:#3b82f6;
}

.event{
background:#3d4046;
padding:8px;
border-radius:8px;
margin-top:8px;
font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<h1>September 2026</h1>

<div class="calendar">

<div class="day">
<h3>Mon</h3>
<div class="event">Programming</div>
</div>

<div class="day">
<h3>Tue</h3>
<div class="event">Database</div>
</div>

<div class="day">
<h3>Wed</h3>
<div class="event">Web Dev</div>
</div>

<div class="day">
<h3>Thu</h3>
</div>

<div class="day">
<h3>Fri</h3>
<div class="event">ICT</div>
</div>

<div class="day">
<h3>Sat</h3>
</div>

<div class="day">
<h3>Sun</h3>
</div>

</div>

</div>

</body>
</html>
