<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Task | TaskFlow</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#202124;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:600px;
background:#2d2f34;
padding:40px;
border-radius:20px;
}

h1{
margin-bottom:30px;
}

input,
textarea,
select{

width:100%;
padding:15px;
margin-top:15px;
background:#3d4046;
border:none;
border-radius:10px;
color:white;

}

button{
    

width:100%;
margin-top:25px;
padding:15px;
background:#3b82f6;
border:none;
border-radius:10px;
color:white;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h1>Add New Task</h1>

<input type="text" placeholder="Task Title">

<textarea placeholder="Description"></textarea>

<select>

<option>High</option>

<option>Medium</option>

<option>Low</option>

</select>

<input type="date">

<select>

<option>Pending</option>

<option>In Progress</option>

<option>Completed</option>

</select>

<div class="buttons">

    <button type="button" onclick="window.location.href='tasks.html'">
    Save Task
</button>

    <a href="tasks.html">
        <button type="button" class="cancel-btn">
            Cancel
        </button>
    </a>

</div>

</div>

</body>
</html>
