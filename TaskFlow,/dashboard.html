<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | TaskFlow</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#202124;
    color:white;
    display:flex;
}

.sidebar{
    width:260px;
    height:100vh;
    background:#18191b;
    padding:30px;
}

.sidebar h2{
    margin-bottom:40px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    padding:15px 0;
}

.sidebar a{
    color:white;
    text-decoration:none;
}

.sidebar a:hover{
    color:#3b82f6;
}

.main{
    flex:1;
    padding:40px;
}

.cards{
    display:flex;
    gap:20px;
    margin-top:30px;
}

.card{
    flex:1;
    background:#2d2f34;
    padding:30px;
    border-radius:15px;
}

.card h2{
    color:#3b82f6;
    margin-bottom:10px;
}

.recent{
    margin-top:40px;
    background:#2d2f34;
    padding:25px;
    border-radius:15px;
}

.task{
    background:#3d4046;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>📋 TaskFlow</h2>

<ul>

<li><a href="dashboard.html">🏠 Dashboard</a></li>

<li><a href="tasks.html">✅ My Tasks</a></li>

<li><a href="calendar.html">📅 Calendar</a></li>

<li><a href="profile.html">👤 Profile</a></li>

<li><a href="index.html">🚪 Logout</a></li>

</ul>

</div>

<div class="main">

<h1>Welcome Back 👋</h1>

<div class="cards">

<div class="card">

<h2>12</h2>

<p>Total Tasks</p>

</div>

<div class="card">

<h2>4</h2>

<p>Pending</p>

</div>

<div class="card">

<h2>8</h2>

<p>Completed</p>

</div>

</div>

<div class="recent">

<h2>Recent Tasks</h2>

<div class="task">
📚 Database Assignment
</div>

<div class="task">
🌐 Web Development
</div>

<div class="task">
📝 ICT Reflection
</div>

</div>

</div>

</body>
</html>
